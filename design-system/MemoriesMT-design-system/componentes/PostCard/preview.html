<!doctype html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../componentes.css">
<script>document.documentElement.setAttribute('data-theme', new URLSearchParams(location.search).get('tema') || 'dia');</script>
<meta charset="utf-8">
<title>PostCard · MemoriesMT</title>
</head>
<body>
<div class="mm-stack">
  <article class="mm-post">
    <div class="mm-post-head">
      <div class="mm-post-autor">
        <span class="mm-avatar" aria-hidden="true">M8</span>
        <div><span class="mm-post-nome">Visão da Mesa 8</span><span class="mm-post-meta">Pôr do sol · há 2 min</span></div>
      </div>
      <button type="button" class="mm-icon-btn" aria-label="Mais opções, incluindo pedir para remover"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
    <div class="mm-media"><span>[foto do convidado]</span><span class="mm-tag">Escolha dos noivos</span></div>
    <p class="mm-post-legenda" style="margin:0">Alguém precisava registrar isso.</p>
    <div class="mm-chips">
      <button type="button" class="mm-chip" aria-pressed="true">Amei 24</button>
      <button type="button" class="mm-chip" aria-pressed="false">Esse momento 11</button>
      <button type="button" class="mm-chip" aria-pressed="false">5 comentários</button>
    </div>
  </article>
</div>
</body>
</html>
