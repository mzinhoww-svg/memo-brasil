<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar presença</title>
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/Fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <nav id="crumbs" class="crumbs"></nav>
  <h1>Você vai?</h1>
  <p>Avise os noivos para eles se organizarem. Dá para mudar a resposta depois.</p>
  <div class="choice">
    <button class="btn" data-v="confirmado"><svg class="ico" aria-hidden="true"><use href="/icons/sprite.svg#festa"/></svg> Vou, sim</button>
    <button class="btn" data-v="recusado">Não consigo ir</button>
  </div>
  <div id="ac" style="display:none">
    <label for="n">Quantos acompanhantes além de você?</label>
    <input id="n" type="number" min="0" max="10" value="0">
  </div>
  <p id="msg" class="err"></p>
  <button class="btn primary" id="salvar" style="margin-top:8px" disabled>Enviar resposta</button>
</main>
<script src="/common.js"></script>
<script>
(async () => {
  const { id, guest, info, sessao } = await carregaConvidado();
  crumbs([{ t: info.titulo }, { t: 'Início', href: `/e/${id}/inicio` }, { t: 'Confirmar presença' }]);
  let status = null;
  const marca = (v) => { status = v; document.querySelectorAll('.choice .btn').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); $('#ac').style.display = v === 'confirmado' ? 'block' : 'none'; $('#salvar').disabled = false; };
  document.querySelectorAll('.choice .btn').forEach((b) => (b.onclick = () => marca(b.dataset.v)));
  if (sessao.rsvp && sessao.rsvp !== 'pendente') { marca(sessao.rsvp); $('#n').value = sessao.acompanhantes; }
  $('#salvar').onclick = async () => {
    $('#msg').textContent = '';
    try {
      await api(`/api/events/${id}/rsvp`, { method: 'POST', headers: { 'content-type': 'application/json', ...guestHdr(id) }, body: JSON.stringify({ guestId: guest.guestId, status, acompanhantes: $('#n').value }) });
      location.href = `/e/${id}/inicio`;
    } catch (e) { $('#msg').textContent = e.message; }
  };
})();
</script>
</body>
</html>
