<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Início</title>
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/Fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/mobile.css">
</head>
<body>
<main>
  <nav id="crumbs" class="crumbs"></nav>
  <p class="center rotulo" id="saud"></p>
  <h1 class="center" id="titulo">…</h1>
  <p class="center" id="quando"></p>
  <div class="stats">
    <div><b id="restam">—</b><span id="restamLbl">Para revelar</span></div>
    <div><b id="fotos">—</b><span>Suas fotos restantes</span></div>
    <div><b id="momentos">0</b><span>Momentos do evento</span></div>
  </div>
  <div id="aviso" class="recado" style="display:none"><p id="avTit" style="font-weight:700"></p><p id="avCorpo" style="margin:0"></p></div>
  <div id="pwa" class="recado" style="display:none">
    <p style="font-weight:700;margin:0 0 4px">Instale o app deste casamento</p>
    <p id="pwaTxt" class="suave" style="margin:0 0 10px"></p>
    <div class="row"><button class="btn primary" id="pwaInstalar" style="display:none">Instalar app</button><button class="btn" id="pwaNotif" style="display:none"><svg class="ico" aria-hidden="true"><use href="/icons/sprite.svg#aviso"/></svg> Ativar avisos</button></div>
    <p id="pwaMsg" class="err" style="margin:8px 0 0"></p>
  </div>
  <div class="hub">
    <a class="hubcard main" id="cCamera"><span class="ic"><svg class="ico" aria-hidden="true"><use href="/icons/sprite.svg#camera"/></svg></span><span><b>Abrir câmera</b><small id="sCamera"></small></span></a>
    <a class="hubcard" id="cAlbum"><span class="ic"><svg class="ico" aria-hidden="true"><use href="/icons/sprite.svg#album"/></svg></span><span><b>Álbum do evento</b><small id="sAlbum"></small></span></a>
    <a class="hubcard" id="cProg"><span class="ic"><svg class="ico" aria-hidden="true"><use href="/icons/sprite.svg#agenda"/></svg></span><span><b>Programação e local</b><small>Horários, endereço e como chegar</small></span></a>
    <a class="hubcard" id="cRec"><span class="ic"><svg class="ico" aria-hidden="true"><use href="/icons/sprite.svg#recado"/></svg></span><span><b>Deixar um recado</b><small>Uma mensagem para os noivos</small></span></a>
  </div>
  <p class="center" style="font-size:13px;margin-top:28px"><a href="#" id="sair" class="tap">Não sou essa pessoa — trocar de nome</a></p>
</main>
<script src="/common.js"></script>
<script>
(async () => {
  const { id, guest, info, sessao } = await carregaConvidado();
  document.title = info.titulo;
  crumbs([{ t: info.titulo }, { t: 'Início' }]);
  $('#saud').textContent = `OLÁ, ${guest.nome.toUpperCase()}`;
  $('#titulo').textContent = info.titulo;
  $('#quando').textContent = [dataBr(info.dataEvento), info.local].filter(Boolean).join(' · ');
  $('#cCamera').href = `/e/${id}/camera`; $('#cAlbum').href = `/e/${id}/album`;
  $('#cProg').href = `/e/${id}/programacao`; $('#cRec').href = `/e/${id}/recados`;
  $('#momentos').textContent = info.momentos;
  const now = relogio(info.agora);
  const tick = () => {
    const ms = new Date(info.revealAt).getTime() - now();
    $('#restam').textContent = ms > 0 ? duracao(ms) : 'Revelado';
    $('#restamLbl').textContent = ms > 0 ? 'Para revelar' : 'Álbum aberto';
  };
  tick(); setInterval(tick, 30000);
  $('#fotos').textContent = sessao.fotosRestantes;
  $('#sCamera').textContent = info.revelado ? 'O evento terminou' : `${sessao.fotosRestantes} de ${info.fotosPorConvidado} fotos disponíveis`;
  $('#sAlbum').textContent = info.revelado ? 'As fotos foram reveladas — veja o que a galera viu' : 'Fotos escondidas até a revelação';
  // Aviso mais recente da organização
  try {
    const av = (await api(`/api/events/${id}/avisos`)).avisos[0];
    if (av) { $('#avTit').textContent = av.titulo; $('#avCorpo').textContent = av.corpo; $('#aviso').style.display = 'block'; }
  } catch {}
  // Instalação do PWA e notificações push
  const instalado = ehPwa();
  const jaPush = localStorage.getItem(`memo:${id}:push`) === '1' && 'Notification' in window && Notification.permission === 'granted';
  const atualizaPwa = () => {
    const card = $('#pwa'); let txt = '', mostra = false;
    if (!instalado) {
      mostra = true;
      if (ehIos()) txt = 'No iPhone: toque em Compartilhar (□↑) e depois em "Adicionar à Tela de Início". Depois abra pelo ícone para ativar os avisos.';
      else if (_promptInstalar) { txt = 'Fique com o álbum na tela inicial e receba um aviso quando as fotos forem reveladas.'; $('#pwaInstalar').style.display = ''; }
      else txt = 'No menu do navegador, escolha "Instalar app" ou "Adicionar à tela inicial" para receber os avisos do casamento.';
    } else if (!jaPush) { mostra = true; txt = 'Receba um aviso quando as fotos forem reveladas e novidades dos noivos.'; $('#pwaNotif').style.display = ''; }
    $('#pwaTxt').textContent = txt; card.style.display = mostra ? 'block' : 'none';
  };
  window.addEventListener('memo:podeinstalar', atualizaPwa);
  $('#pwaInstalar').onclick = async () => { if (await instalarPwa()) { $('#pwa').style.display = 'none'; } };
  $('#pwaNotif').onclick = async () => {
    $('#pwaMsg').textContent = '';
    try { await ativarPush(id, guest.guestId); $('#pwa').style.display = 'none'; } catch (e) { $('#pwaMsg').textContent = e.message; }
  };
  if (!instalado || !jaPush) {
    if (instalado && ehPwa()) atualizaPwa(); else atualizaPwa();
  }
  $('#sair').onclick = (e) => { e.preventDefault(); localStorage.removeItem(guestKey(id)); location.href = `/e/${id}`; };
})();
</script>
</body>
</html>
