<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Você está convidado!</title>
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/Fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/mobile.css">
</head>
<body>
<main>
  <nav id="crumbs" class="crumbs"></nav>
  <div class="envelope">
    <p class="rotulo" style="color:#5b544b">Convite</p>
    <h1>Você está convidado!</h1>
    <p id="titulo" style="font-family:var(--fonte-titulo);font-size:24px;margin:14px 0 4px;color:var(--cor-sobre-papel)">…</p>
    <p>Capture as melhores memórias. Seus cliques viram parte do álbum dos noivos.</p>
  </div>
  <p class="center" id="regra"></p>
  <form id="f">
    <label for="nome">Seu nome (aparece nas suas fotos)</label>
    <input id="nome" maxlength="40" autocomplete="off" list="sugestoes" placeholder="Como os noivos te chamam?" required>
    <datalist id="sugestoes"></datalist>
    <p id="err" class="err"></p>
    <button class="btn primary">Entrar no álbum</button>
  </form>
  <a id="ver" class="btn" style="margin-top:10px;display:none">Ver álbum</a>
</main>
<script src="/common.js"></script>
<script>
const id = eventId();
prepararPwa(id);
(async () => {
  let info;
  try { info = await api(`/api/events/${id}`); }
  catch (e) { document.querySelector('main').innerHTML = `<h1>Convite não encontrado</h1><p>${e.message} Confira o QR Code com os noivos.</p>`; return; }
  document.title = info.titulo;
  $('#titulo').textContent = info.titulo;
  crumbs([{ t: info.titulo }, { t: 'Convite' }]);
  const g = getGuest(id);
  if (g) $('#nome').value = g.nome;
  if (info.revelado) {
    $('#regra').textContent = 'O evento terminou e as fotos já foram reveladas.';
    $('#f').style.display = 'none';
    $('#ver').style.display = 'flex'; $('#ver').href = `/e/${id}/album`; $('#ver').classList.add('primary');
  } else {
    $('#regra').textContent = `Você tem ${info.fotosPorConvidado} fotos. Elas ficam escondidas e são reveladas para todos ao mesmo tempo, no fim da festa.`;
  }
})();
let tbusca;
$('#nome').addEventListener('input', () => {
  clearTimeout(tbusca);
  const q = $('#nome').value.trim();
  if (q.length < 3) return;
  tbusca = setTimeout(async () => {
    try {
      const r = await api(`/api/events/${id}/buscar?q=${encodeURIComponent(q)}`);
      const dl = $('#sugestoes'); dl.textContent = '';
      r.nomes.forEach((n) => { const o = document.createElement('option'); o.value = n; dl.append(o); });
    } catch {}
  }, 250);
});
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#err').textContent = '';
  const nome = $('#nome').value.trim();
  const g = getGuest(id);
  if (g && g.nome === nome) return (location.href = `/e/${id}/inicio`);
  try {
    const r = await api(`/api/events/${id}/guests`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ nome }) });
    setGuest(id, { guestId: r.guestId, nome: r.nome });
    location.href = `/e/${id}/inicio`;
  } catch (er) { $('#err').textContent = er.message; }
});
</script>
</body>
</html>
