name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vitest run --config vitest.functions.config.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.validapay.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validapay-local-browser
          path: web/test-results/
          if-no-files-found: ignore

  payment-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start disposable local PostgreSQL
        run: npx --yes supabase@3.0.0 db start
      - name: Validate migrations, RLS and financial transitions
        run: npx --yes supabase@3.0.0 test db
      - name: Stop local database
        if: always()
        run: npx --yes supabase@3.0.0 stop

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
