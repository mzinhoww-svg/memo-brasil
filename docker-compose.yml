# Lume (Memo Brasil) em produção: app Node atrás do Caddy (HTTPS automático).
# Uso: ver docs/deploy.md. Prefira sempre scripts/deploy.sh (dry-run por padrão).
# Variáveis vêm de .env (veja .env.example) — nenhum segredo mora neste arquivo.
services:
  lume:
    build:
      context: .
      dockerfile: Dockerfile
    image: memo-brasil:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3210"
      DATA_DIR: /data
    volumes:
      # Dados que precisam sobreviver a deploys: banco JSON, fotos, tokens, chaves VAPID.
      - lume-data:/data
      # Destino local dos backups (o backup externo sobe daqui; ver docs/deploy.md).
      - ./backups:/backups
    expose:
      - "3210"
    # Sem portas publicadas no host: só o Caddy fala com o app, pela rede interna.
    networks:
      - lume
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      lume:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - lume
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lume-data:
  caddy-data:
  caddy-config:

networks:
  lume:
